name: SayBeer
options:
  developmentLanguage: vi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: MH385VJBCB
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SayBeer:
    type: application
    platform: iOS
    sources: [SayBeer, Shared]
    dependencies:
      - target: SayBeerMonitor
        embed: true
      - target: SayBeerShield
        embed: true
    info:
      path: SayBeer/Info.plist
      properties:
        CFBundleDisplayName: SayBeer
        CFBundleDevelopmentRegion: vi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: SayBeer/SayBeer.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.jedix.saybeer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jedix.saybeer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SayBeerShield:
    type: app-extension
    platform: iOS
    sources: [SayBeerShield]
    info:
      path: SayBeerShield/Info.plist
      properties:
        CFBundleDisplayName: SayBeerShield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SayBeerShield
    entitlements:
      path: SayBeerShield/SayBeerShield.entitlements
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jedix.saybeer.shield
        SKIP_INSTALL: true
  SayBeerMonitor:
    type: app-extension
    platform: iOS
    sources: [SayBeerMonitor, Shared]
    info:
      path: SayBeerMonitor/Info.plist
      properties:
        CFBundleDisplayName: SayBeerMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SayBeerMonitor
    entitlements:
      path: SayBeerMonitor/SayBeerMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.jedix.saybeer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jedix.saybeer.monitor
        SKIP_INSTALL: true
